<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Registration</title>
  <link rel="stylesheet" href="main.css">
</head>
<body>

  <!-- 1 & 2: Header with exactly one non-empty h1 -->
  <header>
    <h1>Create Your Account</h1>
  </header>

  <!-- 1 & 3: Main containing the form -->
  <main>
    <form action="#" method="post">
      
      <!-- 4, 5, 6: Email input with matching label and 'required' -->
      <div class="field">
        <label for="user-email">Email Address</label>
        <input type="email" id="user-email" name="email" required>
      </div>

      <!-- 4, 5: Password input with matching label -->
      <div class="field">
        <label for="user-password">Password</label>
        <input type="password" id="user-password" name="password">
      </div>

      <!-- 4, 7: Select dropdown with 3+ options and matching label -->
      <div class="field">
        <label for="account-type">Account Type</label>
        <select id="account-type" name="account_type">
          <option value="student">Student</option>
          <option value="developer">Developer</option>
          <option value="manager">Manager</option>
        </select>
      </div>

      <!-- 8 & 9: Submit control inside a .actions container -->
      <div class="actions">
        <!-- 10: Button with class .btn -->
        <button type="submit" class="btn">Sign Up</button>
      </div>

    </form>
  </main>

  <!-- 1: Semantic Footer -->
  <footer>
    <p>&copy; 2026 My App. All rights reserved.</p>
  </footer>

</body>
</html>
